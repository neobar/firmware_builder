name: Build router firmware

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-firmware.yml
      - devices.json
      - configs/**
      - scripts/**
      - patches/**
  workflow_dispatch:
    inputs:
      device:
        description: Device to build (all supported devices)
        type: choice
        default: all
        options:
          - all
          - bpi-r4-pro-8x
          - zbt-z8803be
          - gemtek-xr1710g
          - jdcloud-re-cs-08
          - cudy-tr3000
          - ariaboard-photonicat

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}-${{ inputs.device || (startsWith(github.event.head_commit.message, '[re-cs-08]') && 'jdcloud-re-cs-08') || 'all' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      devices: ${{ steps.matrix.outputs.devices }}
    steps:
      - uses: actions/checkout@v4
      - name: Test firmware verification
        run: python3 -m unittest discover -s tests -v
      - id: matrix
        env:
          DEVICE: ${{ inputs.device || (startsWith(github.event.head_commit.message, '[re-cs-08]') && 'jdcloud-re-cs-08') || 'all' }}
        run: |
          python3 - <<'PY'
          import json, os
          devices = json.load(open('devices.json'))
          choice = os.environ['DEVICE']
          assert choice == 'all' or choice in devices
          selected = devices if choice == 'all' else {choice: devices[choice]}
          matrix = {'include': [dict(device=k, **v) for k, v in selected.items()]}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('devices=' + json.dumps(matrix) + '\n')
          PY

  build:
    needs: matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.devices) }}
    name: ${{ matrix.device }}
    env:
      DEVICE: ${{ matrix.device }}
      SOURCE_REPOSITORY: ${{ matrix.repository }}
      SOURCE_REVISION: ${{ matrix.revision }}
      TARGET: ${{ matrix.target }}
      SUBTARGET: ${{ matrix.subtarget }}
      FORCE_UNSAFE_CONFIGURE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          path: builder

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            python3-pyelftools rsync swig unzip zlib1g-dev file wget curl \
            ca-certificates subversion patch pkgconf libelf-dev device-tree-compiler \
            zstd cpio xz-utils time

      - name: Allocate build space
        run: |
          # Only disposable SDKs on this hosted runner are removed.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h "$GITHUB_WORKSPACE"

      - name: Fetch pinned source
        run: |
          git init source
          git -C source remote add origin "https://github.com/${SOURCE_REPOSITORY}.git"
          git -C source fetch --depth=1 origin "$SOURCE_REVISION"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_REVISION"
          mkdir -p diagnostics
          cp builder/devices.json diagnostics/
          cp -a builder/configs diagnostics/

      - name: Update feeds and apply patches
        working-directory: source
        run: |
          python3 ../builder/scripts/firmware.py feeds "$DEVICE"
          ./scripts/feeds update -a 2>&1 | tee ../diagnostics/feeds-update.log
          python3 ../builder/scripts/firmware.py prepare "$DEVICE"
          python3 ../builder/scripts/firmware.py install-feeds "$DEVICE" 2>&1 | tee ../diagnostics/feeds-install.log
          {
            echo "repository=$SOURCE_REPOSITORY"
            echo "revision=$SOURCE_REVISION"
            for feed in feeds/*; do
              if [ -d "$feed/.git" ] || [ -f "$feed/.git" ]; then
                echo "$(basename "$feed")=$(git -C "$feed" rev-parse HEAD)"
              fi
            done
          } > ../diagnostics/source-versions.txt
          git diff --binary > ../diagnostics/source-changes.patch
          git -C feeds/luci diff --binary > ../diagnostics/luci-changes.patch
          cp -a ../builder/patches ../diagnostics/

      - name: Generate and validate config
        working-directory: source
        run: |
          python3 ../builder/scripts/firmware.py configure "$DEVICE" 2>&1 | tee ../diagnostics/configure.log
          cp .config config.seed ../diagnostics/

      - name: Download sources
        working-directory: source
        run: |
          make download -j8 2>&1 | tee ../diagnostics/download.log

      - name: Compile firmware
        id: compile
        working-directory: source
        run: |
          make -j"$(nproc)" 2>&1 | tee ../diagnostics/build.log || \
            make -j1 V=s 2>&1 | tee ../diagnostics/build-retry.log

      - name: Verify kernel fix and firmware packages
        id: verify
        working-directory: source
        run: |
          cp .config config.seed ../diagnostics/
          cp tmp/.packageinfo ../diagnostics/packageinfo.txt
          cp bin/targets/"$TARGET"/"$SUBTARGET"/{profiles.json,*.manifest} ../diagnostics/
          python3 ../builder/scripts/firmware.py verify "$DEVICE"
          python3 - <<'PY'
          from pathlib import Path
          files = list(Path('build_dir').glob('target-*/linux-*/linux-*/net/netfilter/nf_flow_table_offload.c'))
          assert len(files) == 1, files
          text = files[0].read_text().split('int nf_flow_table_offload_setup(', 1)[1]
          block = '''if (cmd == FLOW_BLOCK_UNBIND) {
          \t\tnf_flow_table_gc_cleanup(flowtable, dev);
          \t\tnf_flow_table_gc_run(flowtable);
          \t\tnf_flow_table_offload_flush(flowtable);
          \t}'''
          assert block in text, 'Kernel fix missing'
          assert text.index(block) < text.index('nf_flow_table_offload_cmd(')
          print('Verified kernel flush before driver unbind')
          PY

      - name: Upload firmware
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.device }}-${{ github.run_number }}-${{ steps.verify.outcome == 'success' && 'verified' || 'unverified' }}
          path: |
            source/bin/targets/${{ matrix.target }}/${{ matrix.subtarget }}/*
            !source/bin/targets/${{ matrix.target }}/${{ matrix.subtarget }}/packages/**
            !source/bin/targets/${{ matrix.target }}/${{ matrix.subtarget }}/*sdk*
            !source/bin/targets/${{ matrix.target }}/${{ matrix.subtarget }}/*imagebuilder*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.device }}-${{ github.run_number }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: Build summary
        if: success()
        run: |
          {
            echo "### $DEVICE"
            echo "Source: $SOURCE_REPOSITORY @ $SOURCE_REVISION"
            echo "Target: $TARGET/$SUBTARGET"
            echo 'Firmware, checksums, package manifests and build diagnostics are available in Artifacts.'
          } >> "$GITHUB_STEP_SUMMARY"
